name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      SESSION_SECRET: ci-test-secret
      NODE_ENV: development
      PORT: '5000'
      INTEGRATION_BASE_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Apply schema (drizzle-kit push)
        run: npx drizzle-kit push --force

      - name: Start dev server in background
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

      - name: Wait for server ready
        run: |
          # Poll /api/healthz (cheap, DB-free) instead of grepping logs.
          # Cold runner + fresh Vite optimization can take 60-120s on first run.
          for i in $(seq 1 180); do
            if curl -sS -o /dev/null -w "%{http_code}" http://localhost:5000/api/healthz 2>/dev/null | grep -q "^200$"; then
              echo "Server healthy at /api/healthz after ${i}s"
              exit 0
            fi
            # Dump log periodically so failures are diagnosable inline.
            if [ "$i" = "5" ] || [ "$i" = "20" ] || [ "$i" = "60" ] || [ "$i" = "120" ]; then
              echo "--- /tmp/dev.log snapshot at ${i}s ---"
              cat /tmp/dev.log 2>&1 || echo "(empty or missing)"
              echo "--- end snapshot ---"
            fi
            sleep 1
          done
          echo "::error::Server did not respond 200 on /api/healthz within 180s"
          echo "--- final /tmp/dev.log ---"
          cat /tmp/dev.log
          exit 1

      - run: npm run integration

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log
          retention-days: 7
          if-no-files-found: warn

      - name: Dev server log (final dump on failure)
        if: failure()
        run: |
          echo "--- final /tmp/dev.log ---"
          cat /tmp/dev.log || true
