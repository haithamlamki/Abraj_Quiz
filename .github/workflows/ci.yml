name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check (informational)
        run: npm run format:check
        continue-on-error: true

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      SESSION_SECRET: ci-test-secret
      NODE_ENV: development
      PORT: '5000'
      INTEGRATION_BASE_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Apply schema (drizzle-kit push)
        run: npx drizzle-kit push --force

      - name: Apply hand-written migrations (match production security setup)
        # drizzle-kit push creates the tables but NOT the hand-written layer:
        # RLS functions/policies, roles, GRANTs, and non-schema indexes (e.g.
        # bank_questions_tags_gin). Apply every hand-written migration from
        # 0003 on — they are all idempotent against a pushed schema — so the
        # integration + migration tests verify the REAL tenant-isolation setup
        # rather than a bare schema. The ephemeral CI DB is fresh, so
        # pre-create the Supabase-style roles the migrations revoke from /
        # grant to (anon, authenticated); 0005 creates quiz_app itself.
        # NOTE: new migrations must be added here or the migration tests fail.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated;"
          for f in migrations/0003_rls.sql \
                   migrations/0005_quiz_app_role.sql \
                   migrations/0006_game_players.sql \
                   migrations/0007_quiz_theme.sql \
                   migrations/0008_quiz_soft_delete.sql \
                   migrations/0009_question_bank.sql \
                   migrations/0010_game_question_snapshot.sql \
                   migrations/0011_quiz_versioning.sql \
                   migrations/0012_audit_log.sql; do
            echo "--- applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed CI tenant
        # tenantMiddleware resolves req.tenant from Origin/Host; with an empty
        # DB nothing resolves and every /api route 404s (breaking assertServerUp).
        # In non-production it falls back to the slug in DEFAULT_TENANT_SLUG
        # (default "abraj"), so seed exactly that. Other columns use their schema
        # defaults (domains [], features {} → all flags default true). Runs as the
        # postgres superuser, which bypasses the tenants RLS policy from 0003.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into tenants (slug, name) values ('abraj', 'Abraj CI') on conflict (slug) do nothing;"

      - name: Start dev server in background
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

      - name: Wait for server ready
        run: |
          # Poll /api/healthz (cheap, DB-free) instead of grepping logs.
          # Cold runner + fresh Vite optimization can take 60-120s on first run.
          for i in $(seq 1 180); do
            if curl -sS -o /dev/null -w "%{http_code}" http://localhost:5000/api/healthz 2>/dev/null | grep -q "^200$"; then
              echo "Server healthy at /api/healthz after ${i}s"
              exit 0
            fi
            # Dump log periodically so failures are diagnosable inline.
            if [ "$i" = "5" ] || [ "$i" = "20" ] || [ "$i" = "60" ] || [ "$i" = "120" ]; then
              echo "--- /tmp/dev.log snapshot at ${i}s ---"
              cat /tmp/dev.log 2>&1 || echo "(empty or missing)"
              echo "--- end snapshot ---"
            fi
            sleep 1
          done
          echo "::error::Server did not respond 200 on /api/healthz within 180s"
          echo "--- final /tmp/dev.log ---"
          cat /tmp/dev.log
          exit 1

      - run: npm run integration

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log
          retention-days: 7
          if-no-files-found: warn

      - name: Dev server log (final dump on failure)
        if: failure()
        run: |
          echo "--- final /tmp/dev.log ---"
          cat /tmp/dev.log || true
